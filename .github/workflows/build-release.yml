name: Build release artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  dmg:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install local transcription build dependency
        run: brew install whisper-cpp libomp

      - name: Build DMG test artifact
        env:
          FLOW_DICTATION_SIGNING_IDENTITY: "-"
        run: ./scripts/build-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlowDictation-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/*.sha256
